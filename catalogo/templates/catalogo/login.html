{% extends 'catalogo/master.html' %}

{% block title %}
Login - Catalogo Film
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-box">
        <h2>Accedi</h2>
        <p style="color: var(--8); margin-bottom: 20px;">Inserisci le tue credenziali</p>

        {% if form.errors %}
            <div class="message error">
                Username o password non validi.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <div style="margin-bottom: 15px;">
                <label for="id_username">Username</label>
                <input type="text" name="username" autofocus required id="id_username" placeholder="Il tuo nome utente">
            </div>

            <div style="margin-bottom: 20px;">
                <label for="id_password">Password</label>
                <input type="password" name="password" required id="id_password" placeholder="••••••••">
            </div>

            <button type="submit" class="btn" style="width: 100%;">Entra</button>
            
            <input type="hidden" name="next" value="{{ next }}">
        </form>
        
        <p style="margin-top: 20px; font-size: 14px; color: var(--9);">
            Non hai un account? Chiedi all'amministratore.
        </p>
    </div>
</div>
{% endblock %}
